</main><script>const portrait=document.querySelector('.portrait');const icon=portrait.querySelector('img');
  function removeIconBackground() {
    const canvas = document.createElement('canvas');
    const width = canvas.width = icon.naturalWidth;
    const height = canvas.height = icon.naturalHeight;
    const context = canvas.getContext('2d', { willReadFrequently: true });
    context.drawImage(icon, 0, 0);
    const image = context.getImageData(0, 0, width, height);
    const pixels = image.data;
    const visited = new Uint8Array(width * height);
    const queue = new Int32Array(width * height);
    let head = 0;
    let tail = 0;

    function visit(pixel) {
      if (visited[pixel]) return;
      visited[pixel] = 1;
      const offset = pixel * 4;
      const red = pixels[offset];
      const green = pixels[offset + 1];
      const blue = pixels[offset + 2];
      if (Math.min(red, green, blue) < 225 || Math.max(red, green, blue) - Math.min(red, green, blue) > 18) return;
      pixels[offset + 3] = 0;
      queue[tail++] = pixel;
    }

    for (let x = 0; x < width; x++) {
      visit(x);
      visit((height - 1) * width + x);
    }
    for (let y = 0; y < height; y++) {
      visit(y * width);
      visit(y * width + width - 1);
    }
    while (head < tail) {
      const pixel = queue[head++];
      const x = pixel % width;
      if (x > 0) visit(pixel - 1);
      if (x < width - 1) visit(pixel + 1);
      if (pixel >= width) visit(pixel - width);
      if (pixel < width * (height - 1)) visit(pixel + width);
    }
    context.putImageData(image, 0, 0);
    // Centre the visible character optically, including her lollipop.
    let weight = 0;
    let weightedX = 0;
    for (let pixel = 0; pixel < width * height; pixel++) {
      const alpha = pixels[pixel * 4 + 3] / 255;
      weight += alpha;
      weightedX += (pixel % width + 0.5) * alpha;
    }
    if (weight) canvas.style.transform = `translateX(${(width / 2 - weightedX / weight) / width * 100}%)`;
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', icon.alt);
    icon.replaceWith(canvas);
  }
  if (icon.complete && icon.naturalWidth) removeIconBackground();
  else icon.addEventListener('load', removeIconBackground, { once: true });</script></body></html>
